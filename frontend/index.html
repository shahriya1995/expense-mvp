<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Expense MVP — LLM Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app">
    <header>
      <div class="brand">
        <div class="logo">💸</div>
        <div class="brand-text">
          <h1>Expense MVP</h1>
          <div class="tag">Chat naturally. Expenses are detected and logged from your message.</div>
        </div>
      </div>
    </header>

    <main>
      <section id="chat">
        <div id="messages" aria-live="polite"></div>

        <div id="composer">
          <div class="composer-shell">
            <textarea id="prompt" rows="1" placeholder="Try: I spent $12 on lunch..."></textarea>
            <button id="send" type="button" aria-label="Send message" title="Send message">
              <span class="send-icon" aria-hidden="true">↑</span>
            </button>
          </div>
          <button id="new-context" type="button">New Expense Chat</button>
        </div>
      </section>
    </main>

  </div>

  <script src="/app.js" type="module"></script>
</body>
</html>
